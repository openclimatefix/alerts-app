name: Branch CI
run-name: 'Branch CI for ${{ github.event.head_commit.message }} by ${{ github.actor }}'

on:
  push:
    branches-ignore: ["main"]
    paths-ignore: ["README.md"]

permissions:
  packages: write
  contents: read

jobs:
  branch-ci:
    uses: openclimatefix/.github/.github/workflows/branch_ci.yml@main
    secrets: inherit
    with:
      enable_linting: true
      enable_typechecking: false
      tests_folder: "tests"
      test_python_versions: '["3.14"]'
      containerfile: "Dockerfile"

  # The shared workflow does not run ty, so run it here
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --locked ty check
